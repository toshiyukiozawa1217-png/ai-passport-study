<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132b53"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>AIパスポート60日学習</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#18273c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#132b53;color:white;padding:23px 18px}main{max-width:650px;margin:auto;padding:18px 16px 70px}.card{background:white;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 3px 16px #1a31530d}.muted{color:#64748b}.bar{height:12px;background:#e6eaf1;border-radius:20px;overflow:hidden}.fill{height:100%;background:#19a68a;width:0}.btn{border:0;border-radius:12px;padding:13px 16px;background:#1557a4;color:white;font-size:16px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8eef8;color:#16335d}.btn:disabled{opacity:.5}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.options{display:grid;gap:10px;margin:18px 0}.option{display:block;padding:13px;border:1px solid #cbd5e1;border-radius:12px;cursor:pointer}.option:has(input:checked){border-color:#1567c1;background:#eff6ff}.pill{display:inline-block;border-radius:100px;padding:5px 11px;background:#e6f5ee;color:#137257;font-size:13px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.day{padding:10px;border:1px solid #dce3ed;border-radius:10px;background:white;color:#233958;cursor:pointer}.day.done{background:#e1f5eb;border-color:#67c5a1}h1{font-size:22px;margin:0}h2{font-size:20px}p{line-height:1.8}.small{font-size:13px}footer{text-align:center;color:#718096;padding:15px}</style></head><body>
<header><div style="max-width:650px;margin:auto"><div class="small">初心者から学ぶ60日間</div><h1>🎓 生成AIパスポート学習</h1></div></header><main>
<div class="card"><div class="row"><strong>学習の進捗</strong><span id="progress">0 / 60日</span></div><p class="bar"><span id="fill" class="fill" style="display:block"></span></p><div class="row"><span class="muted small" id="stats"></span><button class="btn secondary" onclick="showDays()">日付を選ぶ</button></div></div>
<section id="lesson" class="card"><div class="row"><span class="pill" id="phase"></span><span class="muted" id="daylabel"></span></div><h2 id="title"></h2><div id="explain"></div><h3 id="qtitle"></h3><div class="options" id="options"></div><div id="result"></div><div class="row"><button class="btn secondary" onclick="prev()">← 前の日</button><button class="btn" id="check" onclick="check()">採点する</button><button class="btn secondary" onclick="next()">次の日 →</button></div></section>
<section id="days" class="card hidden"><div class="row"><h2>学習日を選ぶ</h2><button class="btn secondary" onclick="showLesson()">戻る</button></div><div class="grid" id="daygrid"></div></section>
<section class="card"><h2>📚 学習の進め方</h2><p>Day 1〜30：解説を読んでから4択問題に挑戦。<br>Day 31〜60：問題を先に解き、不正解を重点的に復習。</p><p class="muted small">学習履歴はこの端末のブラウザー内に保存されます。データ消去や機種変更で失われる場合があります。教材は独自作成であり、公式問題ではありません。試験前にGUGAの最新シラバスも確認してください。</p><button class="btn secondary" onclick="exportData()">学習記録を保存（JSON）</button></section></main><footer>AI Passport Study · Offline PWA</footer>
<script src="data.js"></script><script>
const KEY='passport-study-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"day":1,"results":{}}');let chosen=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){const d=DAYS[state.day-1];chosen=null;document.getElementById('daylabel').textContent='Day '+d.day+' / 60';document.getElementById('phase').textContent=d.day<=30?'1か月目：解説＋問題':'2か月目：問題＋復習';document.getElementById('title').textContent=d.title;document.getElementById('explain').innerHTML=d.day<=30?'<h3>やさしい解説</h3><p>'+d.lesson+'</p>':'<p class="muted">まず問題に挑戦。採点後に解説が表示されます。</p>';document.getElementById('qtitle').textContent='確認問題：'+d.question;document.getElementById('options').innerHTML=d.options.map((x,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"> '+String.fromCharCode(65+i)+'. '+x+'</label>').join('');document.querySelectorAll('input[name=answer]').forEach(x=>x.addEventListener('change',()=>chosen=Number(x.value)));document.getElementById('result').innerHTML='';document.getElementById('check').disabled=false;let keys=Object.keys(state.results);document.getElementById('progress').textContent=keys.length+' / 60日';document.getElementById('fill').style.width=(keys.length/60*100)+'%';document.getElementById('stats').textContent='正解 '+Object.values(state.results).filter(x=>x.correct).length+'問 / 挑戦 '+keys.length+'問';}
function check(){if(chosen===null){alert('回答を選んでください');return}let d=DAYS[state.day-1],ok=chosen===d.answer;state.results[d.day]={choice:chosen,correct:ok};save();document.getElementById('result').innerHTML='<div style="padding:14px;border-radius:12px;background:'+(ok?'#e7f7ef':'#fff2eb')+'"><strong>'+(ok?'⭕ 正解！':'❌ 不正解')+'</strong><p>正解：'+String.fromCharCode(65+d.answer)+'. '+d.options[d.answer]+'</p><p>'+d.explanation+'</p></div>';document.getElementById('check').disabled=true;let keys=Object.keys(state.results);document.getElementById('progress').textContent=keys.length+' / 60日';document.getElementById('fill').style.width=(keys.length/60*100)+'%';document.getElementById('stats').textContent='正解 '+Object.values(state.results).filter(x=>x.correct).length+'問 / 挑戦 '+keys.length+'問'}
function go(n){state.day=Math.min(60,Math.max(1,n));save();showLesson();window.scrollTo(0,0)}function next(){go(state.day+1)}function prev(){go(state.day-1)}function showDays(){document.getElementById('lesson').classList.add('hidden');document.getElementById('days').classList.remove('hidden');document.getElementById('daygrid').innerHTML=DAYS.map(d=>'<button class="day '+(state.results[d.day]?'done':'')+'" onclick="go('+d.day+')">Day '+d.day+'<br><span class="small">'+d.title+'</span></button>').join('')}function showLesson(){document.getElementById('days').classList.add('hidden');document.getElementById('lesson').classList.remove('hidden');render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='ai-passport-progress.json';a.click();URL.revokeObjectURL(a.href)}
render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
